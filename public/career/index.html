<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Career Guidance Agent</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
  rel="stylesheet"
/>

<style>
/* =============================
   GLOBAL LAYOUT & BACKGROUND
   ============================= */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: "Space Grotesk", system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  color: #e5f0ff;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Subtle animated grid background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: linear-gradient(
      rgba(15, 23, 42, 0.45) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(15, 23, 42, 0.45) 1px,
      transparent 1px
    );
  background-size: 48px 48px;
  opacity: 0.8;
  pointer-events: none;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.22), transparent 55%),
    radial-gradient(circle at 80% 100%, rgba(129, 140, 248, 0.18), transparent 55%);
  mix-blend-mode: screen;
  opacity: 0.85;
  pointer-events: none;
  z-index: -1;
}

/* =============================
   TOP NAVBAR
   ============================= */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.top-nav {
  height: 60px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(18px);
  background: linear-gradient(to right, rgba(15, 23, 42, 0.9), rgba(12, 74, 110, 0.7));
  border-bottom: 1px solid rgba(148, 163, 184, 0.35);
  box-shadow: 0 10px 40px rgba(15, 23, 42, 0.7);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Brand mark: image only, no circular container */
.brand-mark {
  width: 50px;
  height: 60px;
  border-radius: 0;
  border: none;
  background: none;
  margin-top: -9px;
  background-image: url('cs1.png');
  background-size: contain; /* Use 'contain' to ensure the whole image fits */
  background-position: center;
  background-repeat: no-repeat;
  
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent; 
  font-size: 0;
  box-shadow: none;
}

.brand-text-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: #e5f0ff;
}

.brand-text-sub {
  font-size: 11px;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 12px;
  color: #9ca3af;
}

.nav-pill {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.5);
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Share Tech Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: #e5e7eb;
}

/* =============================
   MAIN LAYOUT
   ============================= */
.main-area {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: stretch;
  padding: 18px 20px 20px;
   min-height: 0 !important;
}

/* Chat console container */
.console-shell {
  width: 100%;
  max-width: 1024px;
  border-radius: 24px;
  border: 1px solid rgba(148, 163, 184, 0.55);
  background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 0.96));
  box-shadow:
    0 0 0 1px rgba(15, 23, 42, 0.8),
    0 35px 80px rgba(15, 23, 42, 0.9);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

/* Top strip inside console */
.console-header {
  height: 44px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(51, 65, 85, 0.9);
  background: linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.6));
}

.console-dots {
  display: flex;
  gap: 6px;
}
.console-dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  background: #4b5563;
}
.console-dot.red { background: #f97373; }
.console-dot.amber { background: #facc15; }
.console-dot.green { background: #4ade80; }

.console-title {
  font-size: 12px;
  font-family: "Share Tech Mono", monospace;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: #9ca3af;
}
.console-status {
  font-size: 11px;
  font-family: "Share Tech Mono", monospace;
  color: #22c55e;
}

/* Chat window */
#chatWindow {
  flex: 1;
  padding: 22px 36px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto !important;
  overflow-x: hidden;
  scroll-behavior: smooth;
  min-height: 0 !important;
}


/* Scrollbar */
#chatWindow::-webkit-scrollbar {
  width: 8px;
}
#chatWindow::-webkit-scrollbar-track {
  background: transparent;
}
#chatWindow::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.55);
  border-radius: 999px;
}

/* Message bubbles */
.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  position: relative;
  line-height: 1.5;
  font-size: 14px;
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.6);
  animation: fadeIn 0.3s ease-out;
}

.message.agent {
  align-self: flex-start;
  background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.9));
  border: 1px solid rgba(96, 165, 250, 0.65);
}

/* Agent icon uses cs1.png as background image */
.message.agent::before {
  content: "";
  width: 30px; /* Set width for image */
  height: 30px; /* Set height for image */
  position: absolute;
  left: -32px; /* Position */
  top: 2px;
  /* Image properties */
  background-image: url('cs1.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 50%;
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #022c22;
  border: 1px solid rgba(187, 247, 208, 0.6);
  font-weight: 500;
}
.message.user::before {
  content: "🧑‍💻";
  position: absolute;
  right: -28px;
  top: 2px;
  font-size: 18px;
}

/* Centered loader "message" overrides bubble styles */
.message.agent.center-loader {
  align-self: center !important;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 0 !important;
}
.message.agent.center-loader::before {
  content: "" !important;
}

/* See buttons */
.see-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  padding: 8px 14px;
  border: 1px solid rgba(45, 212, 191, 0.7);
  background: radial-gradient(circle at top, rgba(34, 197, 94, 0.2), rgba(5, 46, 22, 0.98));
  color: #bbf7d0;
  font-size: 13px;
  cursor: pointer;
  font-family: "Space Grotesk", system-ui;
}
.see-btn:hover {
  box-shadow: 0 0 16px rgba(45, 212, 191, 0.65);
}

/* Input area */
.chat-input-bar {
  border-top: 1px solid rgba(30, 64, 175, 0.85);
  background: linear-gradient(to right, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.9));
  padding: 10px 18px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.input-shell {
  flex: 1;
  position: relative;
}
#userInput {
  width: 100%;
  padding: 11px 12px 11px 30px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.7);
  background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.95));
  color: #e5f0ff;
  font-size: 14px;
  outline: none;
}
#userInput::placeholder {
  color: #64748b;
}
.input-shell::before {
  content: ">";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: "Share Tech Mono", monospace;
  font-size: 13px;
  color: #38bdf8;
}

#sendBtn {
  border-radius: 999px;
  padding: 10px 18px;
  border: 1px solid rgba(56, 189, 248, 0.9);
  background: radial-gradient(circle at top left, #38bdf8, #1d4ed8);
  color: #e5f0ff;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow:
    0 0 16px rgba(56, 189, 248, 0.7),
    0 10px 25px rgba(15, 23, 42, 0.9);
}
#sendBtn:hover {
  transform: translateY(-1px);
  box-shadow:
    0 0 20px rgba(56, 189, 248, 0.85),
    0 14px 30px rgba(15, 23, 42, 0.96);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =============================
   PREMIUM CENTERED LOADER
   ============================= */

.ai-loader-wrapper {
  width: 360px;
  height: 320px;
  position: relative;
  overflow: hidden;
  background: transparent !important;
  box-shadow: none !important;
}

/* Particles */
.ai-loader-wrapper .particles {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.ai-loader-wrapper .particles span {
  position: absolute;
  width: 3px;
  height: 3px;
  background: #22d3ee;
  border-radius: 50%;
  opacity: 0.6;
  animation: floatUp 10s linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(0); opacity: .3; }
  100% { transform: translateY(-320px); opacity: 0; }
}

/* Loader box */
.ai-loader-box {
  position: relative;
  text-align: center;
  z-index: 2;
  margin-top: 20px;
}

/* Ring */
.ai-ring {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  margin: auto;
  position: relative;
  background: radial-gradient(circle, #020617 40%, #020617 100%);
  box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
}
.ai-ringProgress {
  position: absolute;
  inset: -10px;
  border: 6px solid transparent;
  border-top-color: #22d3ee;
  border-right-color: #22d3ee;
  border-radius: 50%;
  animation: rotateProg linear forwards;
}
@keyframes rotateProg {
  from { transform: rotate(0); }
  to   { transform: rotate(1440deg); }
}

/* Core */
.ai-core {
  width: 110px;
  height: 110px;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  border-radius: 50%;
  
  background: transparent; /* Makes the background transparent */
  background-image: url('sample_logo3_cs499.png');
  background-size: 100%;
  background-position: center;
  background-repeat: no-repeat;

  /*box-shadow:
    0 0 35px rgba(34, 211, 238, 0.8) inset,
    0 0 30px rgba(8, 47, 73, 0.9);*/
  overflow: hidden;
}


/* Scan lines */
.ai-core::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(248, 250, 252, 0.07) 0px,
    rgba(248, 250, 252, 0.07) 2px,
    transparent 4px
  );
  mix-blend-mode: screen;
  animation: scan 4s linear infinite;
}
@keyframes scan {
  from { transform: translateY(0); }
  to   { transform: translateY(15px); }
}

/* Status & timer text */
.ai-status {
  color: #e0f2fe;
  margin-top: 18px;
  font-size: 13px;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
}
.ai-timer {
  margin-top: 4px;
  color: #7dd3fc;
  font-size: 12px;
  font-family: "Share Tech Mono", monospace;
}
</style>
</head>

<body>
<div class="app-shell">

  <header class="top-nav">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-text-title">PATHORA · AI-POWERED SKILL RECOMMENDER & LEARNING PLANNER</div>
        <div class="brand-text-sub">LLM · JOB DATA · SKILL ENGINE</div>
      </div>
    </div>

    <div class="nav-right">
      <div class="nav-pill">
        <span>Software</span>
        <span>Engineering</span>
      </div>
      <div class="nav-pill">
        <span>Data</span>
        <span>Analyst</span>
      </div>
    </div>
  </header>

  <main class="main-area">
    <section class="console-shell">
      <div class="console-header">
        <div class="console-dots">
          <span class="console-dot red"></span>
          <span class="console-dot amber"></span>
          <span class="console-dot green"></span>
        </div>
        <div class="console-title">PATHORA CORE :: Personalized Career Engine </div>
        <div class="console-status">● ONLINE</div>
      </div>

      <div id="chatWindow"></div>

      <footer class="chat-input-bar">
        <div class="input-shell">
          <input
            id="userInput"
            placeholder="Type your response…"
            autocomplete="off"
          />
        </div>
        <button id="sendBtn" type="button">
          <span>Send</span>
          <span>➤</span>
        </button>
      </footer>
    </section>
  </main>
</div>

<script src="chat.js"></script>
</body>
</html>
