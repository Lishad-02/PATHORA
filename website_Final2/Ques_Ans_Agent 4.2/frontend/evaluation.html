<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Skill Evaluation Chatbot</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="evaluation.css" />
</head>

<body>
<div class="app-shell">

  <header class="top-nav">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-text-title">PATHORA · ADAPTIVE SKILL EVALUATOR </div>
        <div class="brand-text-sub">EVALUATION · ASSESSMENT · CAREER ENGINE</div>
      </div>
    </div>

    <div class="nav-right">
      <div class="nav-pill">
        <span>Skill</span>
        <span>Evaluation</span>
      </div>
    </div>
  </header>

  <main class="main-area">
    <section class="console-shell">
      <div class="console-header">
        <div class="console-dots">
          <span class="console-dot red"></span>
          <span class="console-dot amber"></span>
          <span class="console-dot green"></span>
        </div>
        <div class="console-title">SKILL AGENT :: ADAPTIVE ASSESSMENT</div>
        <div class="console-status">● ONLINE</div>
      </div>

      <div id="welcomeScreen">
        <div class="welcome-box">
          <h2 id="welcomeTitle">Welcome to the Adaptive Skill Evaluator</h2>
          <p id="welcomePrompt">Enter your User ID / Email to begin.</p>
          <input
            type="text"
            id="welcomeInput"
            placeholder="user.id@example.com"
            autocomplete="off"
          />
          <button id="welcomeNextBtn" type="button">Next: Enter Skill ➤</button>
        </div>
      </div>
      <div id="chatContainer" class="hidden">
        <div id="chatWindow">
        </div>

        <footer class="chat-input-bar">
          <div class="input-shell">
            <textarea
              id="userInput"
              placeholder="Type your answer here…"
              rows="1"
              autocomplete="off"
            ></textarea>
          </div>
          <button id="sendBtn" type="button">
            <span>Send</span>
            <span>➤</span>
          </button>
        </footer>
      </div>
      </section>
  </main>
</div>

<script src="evaluation.js"></script>
</body>
</html>
