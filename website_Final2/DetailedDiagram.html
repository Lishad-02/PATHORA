<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed System Diagram View</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Base Styles and Colors */
        :root {
            --dark-background: #0D1128;
            --card-background: transparent; 
            --glow-color: #00BFFF;
            --primary-color: #5AA1FF; 
            --text-color: #E0E7FF;
            
            /* --- Responsive Variables --- */
            --desktop-image-padding: 15px; 
            --mobile-image-padding: 8px; 
        }

        /* --- Global and Desktop Styles --- */
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark-background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* --- Headline Styling --- */
        .page-headline {
            font-size: 2.5em;
            color: var(--text-color);
            text-shadow: 0 0 10px var(--glow-color); 
            margin-bottom: 30px; 
            font-weight: bold;
            text-align: center;
        }

        /* --- Main Card Styling (The Box) --- */
        .design-box {
            background-color: var(--card-background);
            
            display: inline-block; 
            max-width: 90vw;

            /* Padding remains for the transparent margin around the image */
            padding: var(--desktop-image-padding); 
            position: relative; 
            overflow: hidden; 
            
            /* Initial glow (sharp corners) */
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4); 
            transition: box-shadow 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        
        /* Hover Effect: Stronger Glow */
        .design-box:hover {
            box-shadow: 
                0 0 30px var(--glow-color),
                0 0 60px rgba(0, 191, 255, 0.4);
            transform: scale(1.01);
        }

        /* --- Image Styling --- */
        .design-box img {
            display: block; 
            max-width: 100%; 
            height: 100%; 
            transition: none;
        }
        
        /* --- Home Button Styling (NEW: Fixed to Top Right Corner of Page) --- */
        .home-button {
            /* Fixes the button relative to the browser window */
            position: fixed; 
            top: 25px; /* Distance from the top edge of the viewport */
            right: 25px; /* Distance from the right edge of the viewport */
            z-index: 100; /* Ensures button is on top of everything */
            
            background-color: rgba(90, 161, 255, 0.1); 
            border: none;
            cursor: pointer;
            padding: 12px; /* Slightly larger padding for better accessibility */
            border-radius: 50%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        
        .home-button i {
            font-size: 1.5em; 
            color: var(--glow-color);
        }

        .home-button:hover {
            background-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        .home-button:hover i {
            color: white; 
        }

        /* =================================================== */
        /* --- MOBILE RESPONSIVENESS (Media Query) --- */
        /* =================================================== */
        @media (max-width: 600px) {
            
            .page-headline {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .design-box {
                padding: var(--mobile-image-padding); 
                max-width: 95vw;
            }

            .home-button {
                /* Slightly adjust position and size for mobile */
                top: 15px; 
                right: 15px; 
                padding: 10px;
            }

            .home-button i {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    
    <button class="home-button" onclick="window.location.href='Final_Landing.html'">
        <i class="fas fa-home"></i> 
    </button>
    
    <h1 class="page-headline">Detailed System Diagram</h1>

    <div class="design-box">

        <img src="Capture.PNG.jpg" alt="Full Box Image Diagram">
        
    </div>

</body>
</html>
