<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detailed Evaluation Report</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<style>
    /* --- BASE STYLES --- */
    body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Space Grotesk', sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
        box-sizing: border-box;
        -webkit-print-color-adjust: exact; /* Critical for printing colors */
        print-color-adjust: exact;
    }

    .report-container {
        max-width: 900px;
        margin: 0 auto;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* --- HEADER & STATS --- */
    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #334155;
        padding-bottom: 20px;
        margin-bottom: 30px;
    }
    .score-badge {
        font-size: 2.5rem;
        font-weight: 700;
        color: #4ade80;
        font-family: 'Share Tech Mono', monospace;
    }
    
    .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }
    .stat-box {
        background: #0f172a;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #334155;
    }
    .stat-label { color: #94a3b8; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.2em; font-weight: bold; margin-top: 5px; color: #fff; }

    /* --- QUESTION CARDS --- */
    .q-card {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        
        /* Critical for PDF: prevent cutting card in half */
        break-inside: avoid; 
        page-break-inside: avoid;
    }
    .q-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding-bottom: 10px;
    }
    .q-text { font-size: 1.05em; margin-bottom: 15px; line-height: 1.5; }
    .feedback-box {
        background: rgba(34, 197, 94, 0.1);
        border-left: 4px solid #22c55e;
        padding: 10px 15px;
        margin-top: 15px;
        font-size: 0.95em;
        color: #dcfce7;
    }
    
    code { 
        background: rgba(255,255,255,0.1); 
        padding: 2px 5px; 
        border-radius: 4px; 
        font-family: monospace; 
        color: #a5f3fc;
        word-wrap: break-word;
    }

    /* --- BUTTONS --- */
    .action-bar {
        margin-top: 40px; 
        text-align: center; 
        border-top: 1px solid #334155; 
        padding-top: 20px;
        display: flex;
        justify-content: center;
        gap: 15px;
    }
    .btn {
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-primary { background: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }

    /* --- PRINT STYLES (Native Browser PDF) --- */
    @media print {
        body {
            background-color: #0f172a !important; /* Force dark bg */
            -webkit-print-color-adjust: exact;
        }
        .report-container {
            border: none;
            box-shadow: none;
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: none;
        }
        .action-bar {
            display: none !important; /* Hide buttons in PDF */
        }
        .q-card {
            break-inside: avoid;
            page-break-inside: avoid;
            border: 1px solid #334155;
        }
    }
</style>
</head>
<body>

<div class="report-container" id="reportContent">
    <div class="header-row">
        <div>
            <h1 style="margin: 0;">Evaluation Report</h1>
            <p style="color: #94a3b8; margin: 5px 0 0 0;">Generated by PATHORA</p>
        </div>
        <div class="score-badge" id="overallScore">0.0</div>
    </div>

    <div class="stat-grid">
        <div class="stat-box">
            <div class="stat-label">Candidate</div>
            <div class="stat-value" id="userId">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Skill</div>
            <div class="stat-value" id="skillName">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Questions</div>
            <div class="stat-value" id="qCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Performance Trend</div>
            <div class="stat-value" id="trend">--</div>
        </div>
    </div>

    <h2 style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px;">Detailed Analysis</h2>
    
    <div id="questionsContainer"></div>
    
    <div class="action-bar" data-html2canvas-ignore="true">
        <button id="nativePrintBtn" class="btn btn-primary">
            <span>🖨️ Save as PDF (Recommended)</span>
        </button>

        <button id="downloadPdfBtn" class="btn btn-secondary">
            <span>⬇ Download Image PDF</span>
        </button>
    </div>
</div>

<script>
    // 1. Retrieve data
    const reportData = JSON.parse(localStorage.getItem('evaluationReport'));

    if (!reportData) {
        document.body.innerHTML = "<h2 style='text-align:center; color:white; margin-top:50px;'>No report data found. Please complete an evaluation first.</h2>";
    } else {
        // 2. Fill Data
        document.getElementById('overallScore').textContent = reportData.average_score.toFixed(1) + " / 10";
        document.getElementById('userId').textContent = reportData.user_id;
        document.getElementById('skillName').textContent = reportData.skill;
        document.getElementById('qCount').textContent = reportData.history.length;
        document.getElementById('trend').textContent = reportData.difficulty_trajectory.join(' → ').toUpperCase();

        const container = document.getElementById('questionsContainer');
        
        reportData.history.forEach(q => {
            const card = document.createElement('div');
            card.className = 'q-card';
            
            let scoreColor = '#facc15'; 
            if(q.score >= 8) scoreColor = '#4ade80'; 
            if(q.score < 5) scoreColor = '#f87171';

            card.innerHTML = `
                <div class="q-header">
                    <span style="font-weight:bold; color: #94a3b8;">Question #${q.index} (${q.difficulty.toUpperCase()})</span>
                    <span style="font-weight:bold; color: ${scoreColor};">Score: ${q.score}/10</span>
                </div>
                <div class="q-text">
                    ${q.question.replace(/\n/g, '<br>')}
                </div>
                <div class="feedback-box">
                    <strong>Feedback:</strong> ${q.feedback}
                </div>
            `;
            container.appendChild(card);
        });

        // METHOD 1: Native Print Logic
        document.getElementById('nativePrintBtn').addEventListener('click', () => {
            window.print(); 
            // NOTE: In the print dialog, user must select "Destination: Save as PDF"
            // The CSS @media print ensures it looks like dark mode.
        });

        // METHOD 2: Library Logic (Fixed Config)
        document.getElementById('downloadPdfBtn').addEventListener('click', () => {
            const element = document.getElementById('reportContent');
            
            const opt = {
              margin:       [10, 10, 10, 10],
              filename:     `${reportData.user_id}_${reportData.skill}_report.pdf`,
              image:        { type: 'jpeg', quality: 0.98 },
              
              // FIX: This forces the canvas to capture the full scroll height
              html2canvas:  { 
                  scale: 2, 
                  useCORS: true, 
                  scrollY: 0,
                  backgroundColor: '#1e293b' 
              },
              
              // FIX: This prevents cutting elements in half
              pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] },
              
              jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const btn = document.getElementById('downloadPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Generating...";
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
            });
        });
    }
</script>

</body>
</html>
